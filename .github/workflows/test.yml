name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS only: the Windows build of softcut-lib is unverified.
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: build and test
      run: make test
